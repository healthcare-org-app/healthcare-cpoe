services:
  cpoe-service:
    build: .
    container_name: cpoe_service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://healthcare:healthcare_dev@postgres:5432/ehr
      KAFKA_BOOTSTRAP: kafka:9092
      SERVICE_HOST_MODE: docker
      PORT_EHR_SERVICE: "8300"
      PORT_DRUG_INTERACTIONS_SERVICE: "8503"
      PORT_FORMULARY_SERVICE: "8504"
      PORT_AUDIT_LOG_SERVICE: "8007"
      LOG_LEVEL: INFO
    ports:
      - "8308:8308"
    networks:
      - healthcare_net
    volumes:
      - ../../libs/py-healthcare-common:/opt/py-healthcare-common:ro
    command: >
      sh -c "pip install -e /opt/py-healthcare-common && python -m app.main"
